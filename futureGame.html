    <link href="style.css" rel = "stylesheet">
    <head>

        </title>
    </head>

        </div>
        <div id = "message-row">
            <h1 id="no"></h1>
        </div>
        <div id="sure">You have completed the game, do you want to play again?</div>
        <div id = row-button>
            <button id = "again">Yes, play again</button>
            <button id= "nothanks">No, take me to home</button>
        </div>
        
    </body>
    <script>
        let one = document.querySelector("#opt1");
        let two = document.querySelector("#opt2");
        let three = document.querySelector("#opt3");

        let fourText = document.querySelector("#fourText");
        let congrats = document.querySelector("#congrats");
        let sorry = document.querySelector("#no");
        let again = document.querySelector("#again");
        let nothanks = document.querySelector("#nothanks");
        let sure = document.querySelector("#sure")
        sorry.style.visibility = "hidden";
        congrats.style.visibility = "hidden";
        again.style.visibility = "hidden";
        nothanks.style.visibility = "hidden";
        sure.style.visibility = "hidden"; 
                    
        questions = [
            "How would you conjugate \"Ser\" in the future for \"yo\"?",
            "What is the future ending for \"yo\"?",
            "What is the future ending for \"ustedes\"?",
            "What is the future ending for \"ellos\"?",
            "What is the future ending for \"nosotros\"?",
            "How would you conjugate \"Ver\" in the future for \"ustedes\"?",
            "What is the future ending for \"él/ella/usted\"?",
            "What is the future ending for \"tú\"?", 
            "How would you conjugate \"Dar\" in the future for \"Tú\"?",
            "How would you conjugate \"Haber\" in the future for \"yo\"?",
            "How would you conjugate \"tener\" in the future for \"ustedes\"?",
            "How would you conjugate \"salir\" in the future for \"tú\"?",
            "How would you conjugate \"caber\" in the future for \"nosotros\"?",
            "How would you conjugate \"Ir\" in the future for \"ellos\"?",
            "How would you conjugate \"Ser\" in the future for \"Tú\"?",
            "How would you conjugate \"Saber\" in the future for \"Nosotros\"?"
             
        ];

        let answers = [
            ["Será", "Seré", "Sere", "Sé"],
            ["-é", "-á", "-e", "-emos"],
            ["-án", "-en", "-én", "-an"],
            ["-én", "-en", "-an", "-án"],
            ["-émos", "-amos", "-imos", "-emos"],
            ["Verá", "Veran", "Verán", "Verén"],
            ["-a", "-á", "-é", "-í"],
            ["-és", "as","-ás", "es" ],
            ["Darás", "Darés", "Daras", "Dás"],
            ["Habrá", "Habre", "Habré", "Haberé"],
            ["Tenerán", "Tendrán", "Tendran", "Teneran"],
            ["Saliras", "Salirás", "Saldrás", "Saldras"],
            ["Cabrémos", "Cabremos", "Caberemos", "Cabramos"],

            ["Seras", "Seas", "Serás", "Seás"],
            ["Sabremos", "Saberemos", "Sabrémos", "Sabramos"]
        ];

        let key = ["\"Fui\"", 
        "\"-é\"",
        "\"-án\"",
        "\"-ieron\"",
        "\"-emos\"",
        "\"Verán\"",
        "\"-á\"",
        "\"-ás\"",
        "\"Darás\"",
        "\"Habré\"",
        "\"Tendrán\"",
        "\"Saldrás\"",
        "\"Cabremos\"",
        "\"Irán\"", 
        "\"Serás\"",
        "\"Sabremos\""
                    ];
        let num;
        let answer;
        let i = 0;
        function sleep(time)
        {
            return new Promise((resolve) => setTimeout(resolve, time));
        }

        one.onclick =  async function(event) {
            event.preventDefault();
            if (num == 2 || num == 3 || num == 9 || num == 14 || num == 16) {
                congrats.style.visibility = "visible";
                congrats.innerHTML = "Correct!";
                await sleep(1000);
                congrats.style.visibility = "hidden";
                if (i == 15) {
                    await sleep(1000);
                    congrats.style.visibility = "hidden";
                    again.style.visibility = "visible";
                    nothanks.style.visibility = "visible";
                    sure.style.visibility = "visible"; 
                    again.onclick = function(event) {
                        i = 0;  
                        changeQuestion(i);
                    }
                    nothanks.onclick = function(event) {
                        window.location.href = "index.html";
                        return;
                    }
                }
                else {
                    i++;
                    changeQuestion(i);
                }
            }

            else {
                sorry.style.visibility = "visible";
                sorry.innerHTML = "Sorry, the answer was " + answer;
                await sleep(1000);
                sorry.style.visibility = "hidden";
                if (i == 15) {
                    await sleep(1000);
                    congrats.style.visibility = "hidden";
                    again.style.visibility = "visible";
                    nothanks.style.visibility = "visible";
                    sure.style.visibility = "visible";

                        i = 0;

                    }

                    changeQuestion(i);
                }
            }
        }

        four.onclick = async function(event) {
            event.preventDefault();
            if (num == 4 || num == 5) {

                congrats.innerHTML = "Correct!";
                await sleep(1000);
                congrats.style.visibility = "hidden";

                    again.style.visibility = "visible";

                    sure.style.visibility = "visible";

                        i = 0;

                    }
                    nothanks.onclick = function(event) {
                        window.location.href = "index.html";
                        return;
                    }
                }
                else {
                    i++;
                    changeQuestion(i);
                }
            }
            
        }
        
        function changeQuestion(i) {
            sure.style.visibility = "hidden"; 
            again.style.visibility = "hidden";
            nothanks.style.visibility = "hidden";
            question.innerHTML = questions[i];
            num = i + 1;
            oneText.innerHTML = answers[i][0];
            twoText.innerHTML = answers[i][1];
            threeText.innerHTML = answers[i][2];
            fourText.innerHTML = answers[i][3];
            answer = key[i];
        }
        changeQuestion(i);
    </script>
    
</html>
